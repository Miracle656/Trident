[toolchain]
# Pinned so CI and local builds agree on one rustc. dtolnay/rust-toolchain
# resolves its version from this file when the workflow step passes no
# `toolchain:` input, which every Rust job in .github/workflows/ci.yml relies
# on. Without it the action cannot resolve a toolchain and every Rust job
# fails at "Install Rust toolchain" before compiling anything.
#
# 1.94 is the floor, set by the strictest dependency rather than by choice:
# sqlx-cli 0.9.0 (installed by the rust CI job) requires rustc 1.94.0, and
# soroban-sdk 26.1.0 requires 1.91.0. Lower it only if both are relaxed.
channel = "1.94.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32v1-none"]
