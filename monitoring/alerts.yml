# Prometheus alerting rules for Trident.
#
# Load via Prometheus's `rule_files:` (see monitoring/README.md for a sample
# scrape config) or adapt into a PrometheusRule CRD if running the Prometheus
# Operator. Every rule assumes the indexer is scraped as job "trident-indexer"
# and the Go API as job "trident-api" — rename the `job=` label matchers
# below if your scrape config uses different job names.
#
# Each alert's `runbook_url` points at docs/runbooks/alerts.md#<anchor>,
# which documents why the threshold was chosen and the first three steps to
# take when it fires. Thresholds and `for` durations are deliberately
# conservative (see the runbook for the reasoning per alert) to avoid paging
# on a single bad scrape or a brief blip.

groups:
  # ---------------------------------------------------------------------------
  # Ledger lag — indexer falling behind the Stellar chain tip.
  # ---------------------------------------------------------------------------
  - name: trident.indexer.lag
    rules:
      - alert: TridentIndexerLagWarning
        expr: trident_indexer_ledger_lag > 200
        for: 10m
        labels:
          severity: warning
          service: indexer
        annotations:
          summary: "Trident indexer is {{ $value }} ledgers behind chain tip"
          description: >
            trident_indexer_ledger_lag has been above 200 ledgers for 10
            minutes on {{ $labels.instance }}. The indexer is falling behind
            but has not yet crossed the critical threshold.
          runbook_url: "docs/runbooks/alerts.md#tridentindexerlagwarning"

      - alert: TridentIndexerLagCritical
        expr: trident_indexer_ledger_lag > 1000
        for: 5m
        labels:
          severity: critical
          service: indexer
        annotations:
          summary: "Trident indexer is critically behind chain tip ({{ $value }} ledgers)"
          description: >
            trident_indexer_ledger_lag has been above 1000 ledgers for 5
            minutes on {{ $labels.instance }}. API consumers are reading
            stale data.
          runbook_url: "docs/runbooks/alerts.md#tridentindexerlagcritical"

  # ---------------------------------------------------------------------------
  # Dead-man's-switch — the poll loop must tick even when nothing else fires.
  # ---------------------------------------------------------------------------
  - name: trident.indexer.heartbeat
    rules:
      - alert: TridentIndexerHeartbeatStale
        expr: (time() - trident_indexer_last_poll_timestamp_seconds) > 300
        for: 2m
        labels:
          severity: critical
          service: indexer
        annotations:
          summary: "Trident indexer heartbeat is stale"
          description: >
            trident_indexer_last_poll_timestamp_seconds on
            {{ $labels.instance }} has not advanced in over 5 minutes. The
            poll loop is hung (deadlock, panic caught by a supervisor,
            blocked I/O) even though the process may still be running and
            /metrics may still respond.
          runbook_url: "docs/runbooks/alerts.md#tridentindexerheartbeatstale"

      # #466 added a TridentIndexerStalled alert here for issue #400. It is
      # dropped: with the metric name corrected above, TridentIndexerHeartbeatStale
      # already covers staleness and TridentIndexerMetricsMissing already
      # covers absence, both at the same critical severity. A third rule on
      # the same series only pages twice for one failure. What #400 actually
      # asked for — firing on silence rather than on lag — is satisfied by
      # these two now that they query a series the indexer emits.

      - alert: TridentIndexerMetricsMissing
        expr: absent(trident_indexer_last_poll_timestamp_seconds)
        for: 3m
        labels:
          severity: critical
          service: indexer
        annotations:
          summary: "Trident indexer metrics are missing entirely"
          description: >
            No trident_indexer_last_poll_timestamp_seconds series exists —
            the indexer's /metrics endpoint is not scrapeable at all (process
            down, crashed, or a scrape-config/network problem).
          runbook_url: "docs/runbooks/alerts.md#tridentindexermetricsmissing"

      - alert: TridentIndexerProcessDown
        expr: up{job="trident-indexer"} == 0
        for: 2m
        labels:
          severity: critical
          service: indexer
        annotations:
          summary: "Trident indexer scrape target is down"
          description: "Prometheus has not been able to scrape trident-indexer for 2 minutes."
          runbook_url: "docs/runbooks/alerts.md#tridentindexerprocessdown"

  # ---------------------------------------------------------------------------
  # Parse errors — malformed events written to parse_errors instead of being
  # indexed (see crates/indexer parse-error-isolation).
  # ---------------------------------------------------------------------------
  - name: trident.indexer.parse_errors
    rules:
      - alert: TridentIndexerParseErrorRateHigh
        expr: >
          (
            sum(rate(trident_indexer_parse_errors_total[10m]))
            /
            (sum(rate(trident_indexer_events_total[10m])) + sum(rate(trident_indexer_parse_errors_total[10m])) + 0.0001)
          ) > 0.01
        for: 15m
        labels:
          severity: warning
          service: indexer
        annotations:
          summary: "Elevated Trident indexer parse-error rate ({{ $value | humanizePercentage }})"
          description: >
            Over 1% of events in the last 10 minutes failed XDR decoding and
            were written to parse_errors instead of soroban_events. Usually
            means an upstream RPC/XDR format change the parser doesn't
            recognise yet.
          runbook_url: "docs/runbooks/alerts.md#tridentindexerparseerrorratehigh"

  # ---------------------------------------------------------------------------
  # Stellar RPC health (#297).
  # ---------------------------------------------------------------------------
  - name: trident.indexer.rpc
    rules:
      - alert: TridentIndexerRPCErrorRateHigh
        expr: >
          (
            sum(rate(trident_indexer_rpc_errors_total[5m]))
            /
            (sum(rate(trident_indexer_rpc_call_duration_seconds_count[5m])) + 0.0001)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          service: indexer
        annotations:
          summary: "Elevated Stellar RPC error rate ({{ $value | humanizePercentage }})"
          description: >
            Over 5% of Stellar RPC calls (getEvents/getLedgers) have errored
            in the last 5 minutes. The upstream RPC node may be degraded,
            rate-limiting, or unreachable.
          runbook_url: "docs/runbooks/alerts.md#tridentindexerrpcerrorratehigh"

      - alert: TridentIndexerRPCErrorRateCritical
        expr: >
          (
            sum(rate(trident_indexer_rpc_errors_total[5m]))
            /
            (sum(rate(trident_indexer_rpc_call_duration_seconds_count[5m])) + 0.0001)
          ) > 0.25
        for: 5m
        labels:
          severity: critical
          service: indexer
        annotations:
          summary: "Critical Stellar RPC error rate ({{ $value | humanizePercentage }})"
          description: >
            Over 25% of Stellar RPC calls have errored in the last 5 minutes
            — the indexer is very likely stalled on RPC failures.
          runbook_url: "docs/runbooks/alerts.md#tridentindexerrpcerrorratecritical"

  # ---------------------------------------------------------------------------
  # Go API — HTTP error rate and process health.
  # ---------------------------------------------------------------------------
  - name: trident.api.http
    rules:
      - alert: TridentAPIHTTP5xxRateHigh
        expr: >
          (
            sum(rate(trident_api_http_requests_total{status=~"5.."}[5m]))
            /
            (sum(rate(trident_api_http_requests_total[5m])) + 0.0001)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Elevated Trident API 5xx rate ({{ $value | humanizePercentage }})"
          description: >
            Over 5% of Go API requests returned a 5xx status in the last 5
            minutes.
          runbook_url: "docs/runbooks/alerts.md#tridentapihttp5xxratehigh"

      - alert: TridentAPIHTTP5xxRateCritical
        expr: >
          (
            sum(rate(trident_api_http_requests_total{status=~"5.."}[5m]))
            /
            (sum(rate(trident_api_http_requests_total[5m])) + 0.0001)
          ) > 0.25
        for: 5m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "Critical Trident API 5xx rate ({{ $value | humanizePercentage }})"
          description: >
            Over 25% of Go API requests returned a 5xx status in the last 5
            minutes — the API is largely unusable.
          runbook_url: "docs/runbooks/alerts.md#tridentapihttp5xxratecritical"

      - alert: TridentAPIProcessDown
        expr: up{job="trident-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "Trident API scrape target is down"
          description: "Prometheus has not been able to scrape trident-api for 2 minutes."
          runbook_url: "docs/runbooks/alerts.md#tridentapiprocessdown"

  # ---------------------------------------------------------------------------
  # Dependency health — Postgres and Redis, as seen through the Go API.
  # GET /v1/health checks both (and gRPC) directly; the Helm chart's
  # liveness/readiness probes already poll it every 10s, which is what keeps
  # this counter moving even when nothing else calls the endpoint. If you run
  # Trident without those probes (e.g. plain docker compose), add an
  # equivalent periodic health check so this alert has samples to evaluate.
  # ---------------------------------------------------------------------------
  - name: trident.api.dependencies
    rules:
      - alert: TridentAPIDependencyUnhealthy
        expr: sum(rate(trident_api_http_requests_total{route="GET /v1/health",status!="200"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "Trident API dependency check is failing"
          description: >
            GET /v1/health has been returning non-200 for 5 minutes. Check
            the response body's `checks` field (postgres/redis/grpc_api) to
            see which dependency is down.
          runbook_url: "docs/runbooks/alerts.md#tridentapidependencyunhealthy"

      - alert: TridentAPIDBPoolSaturated
        expr: >
          (trident_api_db_pool_acquired_connections / trident_api_db_pool_max_connections) > 0.9
        for: 10m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Trident API Postgres pool is close to exhausted ({{ $value | humanizePercentage }} acquired)"
          description: >
            Over 90% of the API's Postgres connection pool has been checked
            out for 10 minutes. Requests will start queuing or timing out on
            acquire once it's fully saturated.
          runbook_url: "docs/runbooks/alerts.md#tridentapidbpoolsaturated"
